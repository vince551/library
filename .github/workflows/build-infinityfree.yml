name: Build AMG InfinityFree Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "server/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".env.production"
      - ".github/workflows/build-infinityfree.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend JavaScript syntax
        run: find server/src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Run backend regression tests
        run: npm test --prefix server

      - name: Build production frontend
        run: npm run build

      - name: Include Apache routing configuration
        run: cp public/.htaccess dist/.htaccess

      - name: Upload InfinityFree-ready website files
        uses: actions/upload-artifact@v5
        with:
          name: AMG-InfinityFree-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
